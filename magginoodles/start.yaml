- name: Start Minecraft
  hosts: Montreal
  tasks:
    - name: Start Minecraft Docker container
      community.docker.docker_container:
        name: minecraft-magginoodles
        image: itzg/minecraft-server:latest
        pull: true
        labels:
          autoheal: 'true'
          diun.enable: 'true'
          diun.watch_repo: 'true'
          diun.notify_on: new;update
          diun.sort_tags: semver
          diun.max_tags: '1'
          diun.include_tags: '^latest$'
          mc-router.host: 'magginoodles.minecraftservers.dev'
        restart_policy: unless-stopped
        env:
          VERSION: '26.3'
          WHITELIST: fieryice12,MaggiNoodles
          OPS: fieryice12
          DIFFICULTY: normal
          HARDCORE: 'false'
          SPAWN_PROTECTION: '0'
          VIEW_DISTANCE: '32'
          EULA: 'true'
          MEMORY: 4G
          ENABLE_RCON: 'false'
          CREATE_CONSOLE_IN_PIPE: 'true'
          MOTD: '2-minute noodles'
          ICON: 'https://cdn.freebiesupply.com/logos/large/2x/maggi-4-logo-png-transparent.png'
          OVERRIDE_ICON: 'true'
        volumes:
          - minecraft-magginoodles:/data
        keep_volumes: false
        state: started
